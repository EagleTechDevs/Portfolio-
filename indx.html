<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EagleTech Devs</title>
  <!-- React and ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    // Header Component
    function Header() {
      return (
      <header>
        <div className="bg-black h-[20vh] flex items-center justify-between px-4 text-white">
          <img src="EAGLETECHlogo.png" alt="EagleTech Logo" width="50" />
          <h1 className="text-lg font-bold">EagleTech Devs</h1>
        </div>
      </header>
      );
    }

    // Footer Component
    function Footer() {
      return (
        <footer className="bg-gray-800 text-white text-center py-4">
          <p>&copy; 2024 EagleTech Devs. All rights reserved.</p>
        </footer>
      );
    }

    // App Component
    function App() {
      return (
        <>
          <Header />
          <Footer />
        </>
      );
    }

    // Render the App Component
    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
